<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#f5f5f7" />
        <title>Admin — Referal Kenya</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                -webkit-font-smoothing: antialiased;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
                background-color: #f5f5f7;
                color: #1d1d1f;
            }
            .apple-card {
                background: #ffffff;
                border-radius: 16px;
                box-shadow:
                    0 4px 24px rgba(0, 0, 0, 0.04),
                    0 1px 2px rgba(0, 0, 0, 0.04);
            }
            .apple-input {
                background: #ffffff;
                border: 1px solid #d2d2d7;
                border-radius: 10px;
                transition: all 0.2s ease;
            }
            .apple-input:focus {
                outline: none;
                border-color: #0071e3;
                box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
            }
            .apple-btn {
                background: #0071e3;
                color: #ffffff;
                border-radius: 9999px;
                font-weight: 500;
                transition: all 0.2s ease;
            }
            .apple-btn:hover {
                background: #0077ed;
            }
            .glass-nav {
                background: rgba(255, 255, 255, 0.8);
                backdrop-filter: saturate(180%) blur(20px);
                -webkit-backdrop-filter: saturate(180%) blur(20px);
            }
            .nav-item.active {
                background: #ffffff;
                color: #000;
                font-weight: 600;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            }
            .nav-item {
                color: #86868b;
                font-weight: 500;
                transition: all 0.2s;
            }
            .nav-item:hover {
                color: #1d1d1f;
                background: rgba(0, 0, 0, 0.03);
            }
            .hide {
                display: none !important;
            }
        </style>
    </head>
    <body class="min-h-screen">
        <!-- LOGIN -->
        <div
            id="loginView"
            class="min-h-screen flex items-center justify-center px-4"
        >
            <div class="apple-card p-8 md:p-10 w-full max-w-md">
                <h1 class="text-2xl font-bold tracking-tight">Administrator</h1>
                <p class="text-[15px] text-gray-500 mt-1">
                    Sign in to manage the platform
                </p>
                <form id="loginForm" class="mt-8 space-y-4">
                    <div>
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1.5"
                            >Phone or email</label
                        >
                        <input
                            name="identifier"
                            required
                            class="w-full apple-input px-4 py-3 text-[15px]"
                        />
                    </div>
                    <div>
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1.5"
                            >Password</label
                        >
                        <input
                            name="password"
                            type="password"
                            required
                            class="w-full apple-input px-4 py-3 text-[15px]"
                        />
                    </div>
                    <button class="w-full apple-btn py-3 text-[16px] mt-2">
                        Sign in
                    </button>
                    <div
                        id="loginMsg"
                        class="text-sm hide rounded-xl px-4 py-3"
                    ></div>
                </form>
            </div>
        </div>

        <!-- ADMIN DASHBOARD -->
        <div id="adminView" class="hide min-h-screen">
            <nav
                class="sticky top-0 z-40 glass-nav border-b border-gray-200/50"
            >
                <div
                    class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between"
                >
                    <div class="flex items-center gap-2">
                        <div
                            class="w-7 h-7 rounded-lg bg-black flex items-center justify-center font-bold text-white text-sm"
                        >
                            R
                        </div>
                        <span class="font-semibold tracking-tight text-[17px]"
                            >Referal Admin</span
                        >
                    </div>
                    <button
                        id="logoutBtn"
                        class="text-sm font-medium text-gray-500 hover:text-black transition-colors"
                    >
                        Logout
                    </button>
                </div>
            </nav>

            <div
                class="max-w-7xl mx-auto px-4 sm:px-6 py-8 grid md:grid-cols-[240px_1fr] gap-8"
            >
                <!-- SIDEBAR -->
                <aside class="space-y-1">
                    <button
                        data-panel="overview"
                        class="nav-item active w-full text-left px-4 py-2.5 rounded-xl text-[15px]"
                    >
                        Overview
                    </button>
                    <button
                        data-panel="users"
                        class="nav-item w-full text-left px-4 py-2.5 rounded-xl text-[15px]"
                    >
                        Users
                    </button>
                    <button
                        data-panel="payments"
                        class="nav-item w-full text-left px-4 py-2.5 rounded-xl text-[15px]"
                    >
                        Payments
                    </button>
                    <button
                        data-panel="commissions"
                        class="nav-item w-full text-left px-4 py-2.5 rounded-xl text-[15px]"
                    >
                        Commissions
                    </button>
                    <button
                        data-panel="withdrawals"
                        class="nav-item w-full text-left px-4 py-2.5 rounded-xl text-[15px]"
                    >
                        Withdrawals
                    </button>
                    <button
                        data-panel="reconciliation"
                        class="nav-item w-full text-left px-4 py-2.5 rounded-xl text-[15px]"
                    >
                        Reconciliation
                    </button>
                    <button
                        data-panel="settings"
                        class="nav-item w-full text-left px-4 py-2.5 rounded-xl text-[15px]"
                    >
                        Settings
                    </button>
                    <button
                        data-panel="audit"
                        class="nav-item w-full text-left px-4 py-2.5 rounded-xl text-[15px]"
                    >
                        Audit log
                    </button>
                    <button
                        data-panel="sync"
                        class="nav-item w-full text-left px-4 py-2.5 rounded-xl text-[15px]"
                    >
                        Sync
                    </button>
                </aside>

                <!-- PANELS -->
                <main class="min-w-0">
                    <!-- Overview -->
                    <div data-panel="overview">
                        <h1 class="text-2xl font-bold tracking-tight mb-6">
                            Overview
                        </h1>
                        <div
                            id="overviewGrid"
                            class="grid grid-cols-2 lg:grid-cols-4 gap-4"
                        ></div>
                    </div>

                    <!-- Users -->
                    <div data-panel="users" class="hide">
                        <h1 class="text-2xl font-bold tracking-tight mb-6">
                            Users
                        </h1>
                        <div
                            class="apple-card p-4 mb-4 flex flex-col sm:flex-row gap-3"
                        >
                            <input
                                id="userSearch"
                                placeholder="Search name, phone, email, or code"
                                class="flex-1 apple-input px-4 py-2.5 text-[15px]"
                            />
                            <select
                                id="userStatus"
                                class="apple-input px-4 py-2.5 text-[15px] text-gray-700"
                            >
                                <option value="">All statuses</option>
                                <option value="active">active</option>
                                <option value="pending_payment">
                                    pending_payment
                                </option>
                                <option value="suspended">suspended</option>
                                <option value="closed">closed</option>
                            </select>
                            <button
                                id="userSearchBtn"
                                class="apple-btn px-6 py-2.5 text-[15px] whitespace-nowrap"
                            >
                                Search
                            </button>
                        </div>
                        <div class="apple-card overflow-hidden">
                            <div
                                id="usersList"
                                class="divide-y divide-gray-100 text-[15px]"
                            ></div>
                        </div>
                    </div>

                    <!-- Payments -->
                    <div data-panel="payments" class="hide">
                        <h1 class="text-2xl font-bold tracking-tight mb-6">
                            Payments
                        </h1>
                        <div class="apple-card overflow-hidden">
                            <div
                                id="paymentsList"
                                class="divide-y divide-gray-100 text-[15px]"
                            ></div>
                        </div>
                    </div>

                    <!-- Commissions -->
                    <div data-panel="commissions" class="hide">
                        <h1 class="text-2xl font-bold tracking-tight mb-6">
                            Commissions
                        </h1>
                        <div class="apple-card overflow-hidden">
                            <div
                                id="commissionsList"
                                class="divide-y divide-gray-100 text-[15px]"
                            ></div>
                        </div>
                    </div>

                    <!-- Withdrawals -->
                    <div data-panel="withdrawals" class="hide">
                        <h1 class="text-2xl font-bold tracking-tight mb-6">
                            Withdrawals &amp; Payouts
                        </h1>

                        <div
                            id="shortfallBanner"
                            class="hide mb-4 rounded-2xl border p-4 text-sm"
                        >
                            <div class="font-semibold mb-1">
                                B2C wallet needs a top-up
                            </div>
                            <div id="shortfallBody" class="text-gray-700"></div>
                        </div>

                        <div class="mb-4 flex flex-wrap gap-3 items-center">
                            <button
                                id="disburseBtn"
                                class="apple-btn px-6 py-2.5 text-[15px]"
                            >
                                Disburse queued payouts
                            </button>
                            <span
                                id="queueSummary"
                                class="text-sm text-gray-500"
                            ></span>
                        </div>
                        <div
                            id="payoutMsg"
                            class="hide text-sm rounded-xl px-4 py-3 mb-4"
                        ></div>
                        <div class="apple-card overflow-hidden">
                            <div
                                id="withdrawalsList"
                                class="divide-y divide-gray-100 text-[15px]"
                            ></div>
                        </div>
                    </div>

                    <!-- Reconciliation -->
                    <div data-panel="reconciliation" class="hide">
                        <h1 class="text-2xl font-bold tracking-tight mb-6">
                            Reconciliation
                        </h1>
                        <button
                            id="runReconBtn"
                            class="apple-btn px-6 py-2.5 text-[15px] mb-4"
                        >
                            Run reconciliation
                        </button>
                        <div
                            id="reconMsg"
                            class="hide text-sm rounded-xl px-4 py-3 mb-4"
                        ></div>
                        <div class="apple-card overflow-hidden mb-4">
                            <div
                                class="px-6 py-4 border-b border-gray-100 font-semibold text-sm text-gray-500 uppercase tracking-wider"
                            >
                                Recent runs
                            </div>
                            <div
                                id="runsList"
                                class="divide-y divide-gray-100 text-[15px]"
                            ></div>
                        </div>
                        <div class="apple-card overflow-hidden">
                            <div
                                class="px-6 py-4 border-b border-gray-100 font-semibold text-sm text-gray-500 uppercase tracking-wider"
                            >
                                Exceptions
                            </div>
                            <div
                                id="exceptionsList"
                                class="divide-y divide-gray-100 text-[15px]"
                            ></div>
                        </div>
                    </div>

                    <!-- Settings -->
                    <div data-panel="settings" class="hide">
                        <h1 class="text-2xl font-bold tracking-tight mb-6">
                            Settings
                        </h1>
                        <div id="settingsList" class="space-y-3"></div>
                    </div>

                    <!-- Audit -->
                    <div data-panel="audit" class="hide">
                        <h1 class="text-2xl font-bold tracking-tight mb-6">
                            Audit log
                        </h1>
                        <div class="apple-card overflow-hidden">
                            <div
                                id="auditList"
                                class="divide-y divide-gray-100 text-[15px]"
                            ></div>
                        </div>
                    </div>

                    <!-- Sync -->
                    <div data-panel="sync" class="hide">
                        <h1 class="text-2xl font-bold tracking-tight mb-6">
                            Turso Sync
                        </h1>
                        <div class="apple-card p-6 mb-4">
                            <div
                                id="syncStatus"
                                class="text-[15px] space-y-2"
                            ></div>
                        </div>
                        <div class="flex flex-wrap gap-3 mb-4">
                            <button
                                id="syncRefreshBtn"
                                class="bg-gray-100 hover:bg-gray-200 text-black px-6 py-2.5 rounded-full font-medium text-[15px] transition-colors"
                            >
                                Refresh status
                            </button>
                            <button
                                id="syncFlushBtn"
                                class="apple-btn px-6 py-2.5 text-[15px]"
                            >
                                Flush queue
                            </button>
                            <button
                                id="syncPushBtn"
                                class="apple-btn px-6 py-2.5 text-[15px]"
                            >
                                Push local → Turso
                            </button>
                            <button
                                id="syncPullBtn"
                                class="bg-red-500 hover:bg-red-600 text-white px-6 py-2.5 rounded-full font-medium text-[15px] transition-colors"
                            >
                                Pull Turso → local
                            </button>
                        </div>
                        <div
                            id="syncMsg"
                            class="hide text-sm rounded-xl px-4 py-3 mb-4"
                        ></div>
                    </div>
                </main>
            </div>
        </div>

        <script>
            (() => {
                const $ = (s) => document.querySelector(s);
                const $$ = (s) => document.querySelectorAll(s);
                const fmt = (kobo) =>
                    "KSh " +
                    ((kobo || 0) / 100).toLocaleString("en-KE", {
                        minimumFractionDigits: 0,
                        maximumFractionDigits: 2,
                    });

                function escapeHtml(str) {
                    return String(str == null ? "" : str)
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;")
                        .replace(/'/g, "&#39;");
                }

                function showMsg(el, text, type) {
                    el.textContent = text;
                    el.classList.remove("hide");
                    el.className =
                        "text-sm rounded-xl px-4 py-3 mb-4 " +
                        (type === "error"
                            ? "bg-red-50 text-red-600 border border-red-200"
                            : "bg-green-50 text-green-700 border border-green-200");
                }

                async function api(url, opts = {}) {
                    const res = await fetch(url, {
                        credentials: "same-origin",
                        ...opts,
                    });
                    let data = null;
                    try {
                        data = await res.json();
                    } catch (e) {}
                    if (!res.ok)
                        throw new Error(
                            (data && data.error) || "HTTP " + res.status,
                        );
                    return data;
                }

                $("#loginForm").addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const fd = new FormData(e.target);
                    try {
                        const data = await api("/api/auth/login", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                identifier: fd.get("identifier"),
                                password: fd.get("password"),
                            }),
                        });
                        if (data.user.role !== "admin")
                            throw new Error("Not an admin account");
                        location.reload();
                    } catch (err) {
                        showMsg($("#loginMsg"), err.message, "error");
                    }
                });

                $("#logoutBtn").addEventListener("click", async () => {
                    await fetch("/api/auth/logout", { method: "POST" });
                    location.reload();
                });

                $$("button[data-panel]").forEach((el) => {
                    el.addEventListener("click", () => {
                        $$("button[data-panel]").forEach((x) =>
                            x.classList.remove("active"),
                        );
                        el.classList.add("active");
                        $$("main > div[data-panel]").forEach((p) =>
                            p.classList.add("hide"),
                        );
                        document
                            .querySelector(
                                `main > div[data-panel="${el.dataset.panel}"]`,
                            )
                            .classList.remove("hide");
                        loadPanel(el.dataset.panel);
                    });
                });

                function loadPanel(name) {
                    if (name === "overview") loadOverview();
                    if (name === "users") loadUsers();
                    if (name === "payments") loadPayments();
                    if (name === "commissions") loadCommissions();
                    if (name === "withdrawals") loadWithdrawals();
                    if (name === "reconciliation") loadReconciliation();
                    if (name === "settings") loadSettings();
                    if (name === "audit") loadAudit();
                    if (name === "sync") loadSync();
                }

                async function boot() {
                    try {
                        const me = await api("/api/auth/me");
                        if (me.user.role !== "admin")
                            throw new Error("Not admin");
                        $("#loginView").classList.add("hide");
                        $("#adminView").classList.remove("hide");
                        loadOverview();
                        loadUsers();
                    } catch (e) {
                        $("#loginView").classList.remove("hide");
                    }
                }

                async function loadOverview() {
                    const d = await api("/api/admin/overview");
                    const cards = [
                        ["Registered users", d.totalUsers],
                        ["Active members", d.activeMembers],
                        ["Pending payments", d.pendingMembers],
                        ["Successful collections", d.payments.counts.success],
                        [
                            "Gross collections",
                            fmt(d.payments.amountsKobo.success),
                        ],
                        ["Processing fees", fmt(d.processingFeesKobo)],
                        ["Platform allocation", fmt(d.platformAllocationKobo)],
                        [
                            "Commissions pending",
                            fmt(d.commissions.amountsKobo.pending),
                        ],
                        [
                            "Commissions available",
                            fmt(d.commissions.amountsKobo.available),
                        ],
                        [
                            "Commissions paid",
                            fmt(d.commissions.amountsKobo.paid),
                        ],
                        ["Payouts paid", fmt(d.withdrawals.amountsKobo.paid)],
                        [
                            "Payouts pending",
                            fmt(
                                d.withdrawals.amountsKobo.requested +
                                    d.withdrawals.amountsKobo.processing,
                            ),
                        ],
                        [
                            "Queued payouts",
                            `${d.queuedPayouts.count} · ${fmt(d.queuedPayouts.totalKobo)}`,
                        ],
                        [
                            "Open recon exceptions",
                            d.openReconciliationExceptions,
                        ],
                    ];
                    $("#overviewGrid").innerHTML = cards
                        .map(
                            ([k, v]) => `
      <div class="apple-card p-5">
        <div class="text-xs font-medium text-gray-500 mb-1">${escapeHtml(k)}</div>
        <div class="text-xl font-bold">${escapeHtml(v)}</div>
      </div>
    `,
                        )
                        .join("");
                }

                async function loadUsers() {
                    const q = $("#userSearch").value || "";
                    const status = $("#userStatus").value || "";
                    const params = new URLSearchParams({
                        q,
                        status,
                        page: 1,
                        pageSize: 50,
                    });
                    const d = await api("/api/admin/users?" + params);
                    const list = $("#usersList");
                    if (!d.items.length) {
                        list.innerHTML =
                            '<div class="p-6 text-gray-400 text-center">No users found.</div>';
                        return;
                    }
                    list.innerHTML = d.items
                        .map(
                            (u) => `
      <div class="px-6 py-4 flex items-center justify-between gap-4">
        <div>
          <div class="font-semibold">${escapeHtml(u.full_name)} <span class="text-xs font-normal text-gray-500 ml-1">${escapeHtml(u.phone)}</span></div>
          <div class="text-xs text-gray-500 mt-0.5">${escapeHtml(u.email || "No email")} • Code: ${escapeHtml(u.referral_code || "—")} • Joined ${new Date(u.created_at).toLocaleDateString()}</div>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-medium px-2.5 py-1 rounded-full ${
              u.status === "active"
                  ? "bg-green-100 text-green-700"
                  : u.status === "suspended"
                    ? "bg-red-100 text-red-700"
                    : "bg-gray-100 text-gray-600"
          }">${escapeHtml(u.status)}</span>
          ${
              u.status === "suspended"
                  ? `<button data-action="activate" data-id="${escapeHtml(u.id)}" class="text-xs font-medium px-3 py-1.5 rounded-full bg-[#34c759] text-white hover:bg-green-600 transition-colors">Activate</button>`
                  : `<button data-action="suspend" data-id="${escapeHtml(u.id)}" class="text-xs font-medium px-3 py-1.5 rounded-full bg-red-500 text-white hover:bg-red-600 transition-colors">Suspend</button>`
          }
          <button data-action="delete" data-id="${escapeHtml(u.id)}" data-name="${escapeHtml(u.full_name)}" class="text-xs font-medium px-3 py-1.5 rounded-full bg-gray-800 text-white hover:bg-black transition-colors">Delete</button>
        </div>
      </div>
    `,
                        )
                        .join("");

                    $$("#usersList button[data-action]").forEach((btn) => {
                        btn.addEventListener("click", () => {
                            const id = btn.dataset.id;
                            if (btn.dataset.action === "suspend")
                                window.__suspend(id);
                            else if (btn.dataset.action === "activate")
                                window.__activate(id);
                            else if (btn.dataset.action === "delete")
                                window.__deleteUser(
                                    id,
                                    btn.dataset.name || "this user",
                                );
                        });
                    });
                }
                window.__suspend = async (id) => {
                    const reason =
                        prompt("Reason for suspension:") ||
                        "Suspended by admin";
                    await api("/api/admin/users/" + id + "/status", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ status: "suspended", reason }),
                    });
                    loadUsers();
                };
                window.__activate = async (id) => {
                    await api("/api/admin/users/" + id + "/status", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ status: "active" }),
                    });
                    loadUsers();
                };
                window.__deleteUser = async (id, name) => {
                    if (
                        !confirm(
                            `Permanently delete ${name} and all their data? This cannot be undone.`,
                        )
                    )
                        return;
                    if (
                        !confirm(
                            "Final confirmation: this removes the user from both the local DB and Turso immediately.",
                        )
                    )
                        return;
                    try {
                        const r = await api("/api/admin/users/" + id, {
                            method: "DELETE",
                        });
                        if (r.forfeitedPendingKobo > 0) {
                            alert(
                                `User deleted. KSh ${(r.forfeitedPendingKobo / 100).toFixed(2)} of pending commissions were forfeited.`,
                            );
                        }
                        loadUsers();
                    } catch (e) {
                        alert("Delete failed: " + e.message);
                    }
                };
                $("#userSearchBtn").addEventListener("click", loadUsers);

                async function loadPayments() {
                    const d = await api(
                        "/api/admin/payments?page=1&pageSize=50",
                    );
                    const list = $("#paymentsList");
                    if (!d.items.length) {
                        list.innerHTML =
                            '<div class="p-6 text-gray-400 text-center">No payments found.</div>';
                        return;
                    }
                    list.innerHTML = d.items
                        .map(
                            (p) => `
      <div class="px-6 py-4 flex items-center justify-between gap-4">
        <div>
          <div class="font-semibold">${escapeHtml(p.internal_reference)}</div>
          <div class="text-xs text-gray-500 mt-0.5">${escapeHtml(p.full_name || "")} • ${escapeHtml(p.phone || "")} • ${new Date(p.created_at).toLocaleString()}</div>
        </div>
        <div class="text-right">
          <div class="font-semibold">${fmt(p.actual_amount_kobo || p.expected_amount_kobo)}</div>
          <div class="text-xs font-medium mt-0.5 ${p.status === "success" ? "text-[#34c759]" : p.status === "failed" ? "text-red-500" : "text-[#ff9f0a]"}">${escapeHtml(p.status)}</div>
        </div>
      </div>
    `,
                        )
                        .join("");
                }

                async function loadCommissions() {
                    const d = await api(
                        "/api/admin/commissions?page=1&pageSize=50",
                    );
                    const list = $("#commissionsList");
                    if (!d.items.length) {
                        list.innerHTML =
                            '<div class="p-6 text-gray-400 text-center">No commissions found.</div>';
                        return;
                    }
                    list.innerHTML = d.items
                        .map(
                            (c) => `
      <div class="px-6 py-4 flex items-center justify-between gap-4">
        <div>
          <div class="font-semibold">${escapeHtml(c.beneficiary_name)} <span class="text-xs font-normal text-gray-500">referred</span> ${escapeHtml(c.source_name)}</div>
          <div class="text-xs text-gray-500 mt-0.5">${new Date(c.created_at).toLocaleString()}</div>
        </div>
        <div class="text-right">
          <div class="font-semibold text-[#34c759]">${fmt(c.amount_kobo)}</div>
          <div class="text-xs font-medium mt-0.5 text-[#ff9f0a]">${escapeHtml(c.status)}</div>
        </div>
      </div>
    `,
                        )
                        .join("");
                }

                async function loadWithdrawals() {
                    try {
                        const q = await api("/api/admin/withdrawals/queue");
                        const banner = $("#shortfallBanner");
                        const body = $("#shortfallBody");
                        const summary = $("#queueSummary");
                        if (q.count > 0) {
                            banner.classList.remove("hide");
                            banner.className =
                                "mb-4 rounded-2xl border p-4 text-sm bg-yellow-50 text-yellow-900 border-yellow-200";
                            body.innerHTML =
                                `<span class="font-bold">${escapeHtml(q.count)} payout(s)</span> are queued, totalling ` +
                                `<span class="font-bold">${fmt(q.totalKobo)}</span>. ` +
                                `Top up your PalPluss B2C wallet, then click <em>Disburse queued payouts</em>.`;
                            summary.textContent = `${q.count} queued · ${fmt(q.totalKobo)}`;
                        } else {
                            banner.classList.add("hide");
                            summary.textContent = "Queue is empty";
                        }
                    } catch (e) {}

                    const d = await api(
                        "/api/admin/withdrawals?page=1&pageSize=50",
                    );
                    const list = $("#withdrawalsList");
                    if (!d.items.length) {
                        list.innerHTML =
                            '<div class="p-6 text-gray-400 text-center">No withdrawals found.</div>';
                        return;
                    }
                    list.innerHTML = d.items
                        .map((w) => {
                            const statusClass =
                                w.status === "paid"
                                    ? "text-[#34c759]"
                                    : w.status === "failed"
                                      ? "text-red-500"
                                      : w.status === "queued"
                                        ? "text-yellow-700"
                                        : "text-[#ff9f0a]";
                            const note =
                                w.status === "queued" && w.failure_reason
                                    ? `<div class="text-[11px] text-gray-500 mt-0.5">${escapeHtml(w.failure_reason)}</div>`
                                    : "";
                            const reconcileBtn =
                                w.status !== "paid" && w.provider_transfer_code
                                    ? `<button data-reconcile="${escapeHtml(w.id)}" class="text-xs mt-1.5 px-3 py-1 rounded-full bg-gray-100 font-medium hover:bg-gray-200 transition-colors">Reconcile</button>`
                                    : "";
                            return `
      <div class="px-6 py-4 flex items-center justify-between gap-4">
        <div>
          <div class="font-semibold">${escapeHtml(w.full_name)} <span class="text-xs font-normal text-gray-500">${escapeHtml(w.payout_phone)}</span></div>
          <div class="text-xs text-gray-500 mt-0.5">${new Date(w.created_at).toLocaleString()} • Transfer: ${escapeHtml(w.provider_transfer_code || "none")}</div>
          ${note}
        </div>
        <div class="text-right">
          <div class="font-semibold">${fmt(w.amount_kobo)}</div>
          <div class="text-xs font-medium mt-0.5 ${statusClass}">${escapeHtml(w.status)}</div>
          ${reconcileBtn}
        </div>
      </div>`;
                        })
                        .join("");

                    $$("#withdrawalsList button[data-reconcile]").forEach(
                        (btn) => {
                            btn.addEventListener("click", () =>
                                window.__reconcilePayout(btn.dataset.reconcile),
                            );
                        },
                    );
                }
                window.__reconcilePayout = async (id) => {
                    try {
                        const r = await api(
                            "/api/admin/withdrawals/" + id + "/reconcile",
                            { method: "POST" },
                        );
                        alert("Result: " + JSON.stringify(r));
                        loadWithdrawals();
                    } catch (e) {
                        alert(e.message);
                    }
                };

                (function () {
                    const btn = $("#disburseBtn");
                    if (!btn) return;
                    btn.addEventListener("click", async () => {
                        btn.disabled = true;
                        const original = btn.textContent;
                        btn.textContent = "Disbursing…";
                        try {
                            const r = await api(
                                "/api/admin/withdrawals/disburse",
                                { method: "POST" },
                            );
                            const summary =
                                `Sent ${r.sent}, still queued ${r.stillQueued}, failed ${r.failed}. ` +
                                (r.remainingCount > 0
                                    ? `Still need ${fmt(r.remainingKobo)} for ${r.remainingCount} payout(s).`
                                    : "Queue is empty.");
                            showMsg(
                                $("#payoutMsg"),
                                summary,
                                r.failed > 0 ? "error" : "ok",
                            );
                            loadWithdrawals();
                        } catch (e) {
                            showMsg($("#payoutMsg"), e.message, "error");
                        } finally {
                            btn.disabled = false;
                            btn.textContent = original;
                        }
                    });
                })();

                async function loadReconciliation() {
                    const d = await api("/api/admin/reconciliation");
                    $("#runsList").innerHTML = d.runs.length
                        ? d.runs
                              .map(
                                  (r) => `
      <div class="px-6 py-4 flex items-center justify-between">
        <div class="text-xs text-gray-500 font-mono">${escapeHtml(r.id)}</div>
        <div class="text-xs font-medium">${escapeHtml(r.status)} • ${r.finished_at ? new Date(r.finished_at).toLocaleString() : "running"}</div>
      </div>
    `,
                              )
                              .join("")
                        : '<div class="p-6 text-gray-400 text-center">No runs yet</div>';
                    $("#exceptionsList").innerHTML = d.exceptions.length
                        ? d.exceptions
                              .map(
                                  (x) => `
      <div class="px-6 py-4">
        <div class="text-xs font-medium ${x.resolved ? "text-gray-400" : "text-red-500"}">${escapeHtml(x.exception_type)} • ${x.resolved ? "resolved" : "open"}</div>
        <div class="text-sm mt-1">${escapeHtml(x.description || "")}</div>
      </div>
    `,
                              )
                              .join("")
                        : '<div class="p-6 text-gray-400 text-center">No exceptions</div>';
                }
                $("#runReconBtn").addEventListener("click", async () => {
                    try {
                        const r = await api("/api/admin/reconciliation/run", {
                            method: "POST",
                        });
                        showMsg(
                            $("#reconMsg"),
                            "Reconciliation complete: " +
                                r.exceptions.length +
                                " exceptions",
                            "ok",
                        );
                        loadReconciliation();
                    } catch (e) {
                        showMsg($("#reconMsg"), e.message, "error");
                    }
                });

                async function loadSettings() {
                    const d = await api("/api/admin/settings");
                    $("#settingsList").innerHTML = d.items
                        .map(
                            (s) => `
                      <div class="apple-card p-4 flex items-center gap-4">
                        <div class="flex-1">
                          <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide">${escapeHtml(s.key)}</div>
                          <input data-key="${escapeHtml(s.key)}" value="${escapeHtml(s.value)}" class="w-full apple-input px-3 py-2 text-[15px] mt-1.5" />
                        </div>
                        <button data-save-key="${escapeHtml(s.key)}" class="text-sm font-medium px-4 py-2 rounded-full bg-gray-100 hover:bg-gray-200 transition-colors">Save</button>
                      </div>
                    `,
                        )
                        .join("");

                    $$("#settingsList button[data-save-key]").forEach((btn) => {
                        btn.addEventListener("click", () =>
                            window.__saveSetting(btn.dataset.saveKey, btn),
                        );
                    });
                }

                window.__saveSetting = async (key, btn) => {
                    const input = document.querySelector(`[data-key="${key}"]`);
                    try {
                        await api("/api/admin/settings", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ key, value: input.value }),
                        });
                        btn.textContent = "Saved";
                        btn.classList.replace("bg-gray-100", "bg-green-100");
                        btn.classList.replace("text-black", "text-green-700");
                        setTimeout(() => {
                            btn.textContent = "Save";
                            btn.classList.replace(
                                "bg-green-100",
                                "bg-gray-100",
                            );
                            btn.classList.replace(
                                "text-green-700",
                                "text-black",
                            );
                        }, 1500);
                    } catch (e) {
                        alert(e.message);
                    }
                };

                async function loadAudit() {
                    const d = await api("/api/admin/audit?page=1&pageSize=100");
                    $("#auditList").innerHTML = d.items.length
                        ? d.items
                              .map(
                                  (a) => `
      <div class="px-6 py-3">
        <div class="text-xs text-gray-500">${new Date(a.created_at).toLocaleString()} • <span class="font-semibold text-black">${escapeHtml(a.action)}</span></div>
        <div class="text-sm mt-0.5">${escapeHtml(a.entity_type || "")} ${escapeHtml(a.entity_id || "")}</div>
      </div>
    `,
                              )
                              .join("")
                        : '<div class="p-6 text-gray-400 text-center">No audit entries</div>';
                }

                // ---- Turso Sync panel ----
                async function loadSync() {
                    try {
                        const d = await api("/api/admin/sync/status");
                        const rows = [
                            ["Turso enabled", d.enabled ? "yes" : "no"],
                            ["Active", d.active ? "yes" : "no"],
                            ["Flushing", d.flushing ? "yes" : "no"],
                            ["Queue length", d.queueLength],
                            ["Database URL", d.url || "—"],
                            ["Last error", d.lastError || "—"],
                            ["Last error at", d.lastErrorAt || "—"],
                            ["Checked at", d.timestamp],
                        ];
                        $("#syncStatus").innerHTML = rows
                            .map(
                                ([k, v]) => `
                                <div class="flex justify-between gap-4">
                                    <span class="text-gray-500">${escapeHtml(k)}</span>
                                    <span class="font-medium text-right break-all">${escapeHtml(v)}</span>
                                </div>`,
                            )
                            .join("");
                    } catch (e) {
                        $("#syncStatus").innerHTML =
                            `<div class="text-red-600">${escapeHtml(e.message)}</div>`;
                    }
                }

                $("#syncRefreshBtn").addEventListener("click", loadSync);

                $("#syncFlushBtn").addEventListener("click", async () => {
                    const btn = $("#syncFlushBtn");
                    btn.disabled = true;
                    try {
                        const r = await api("/api/admin/sync/flush", {
                            method: "POST",
                        });
                        showMsg(
                            $("#syncMsg"),
                            `Flush complete: ${r.flushed} written, ${r.remaining} remaining.`,
                            r.remaining > 0 ? "error" : "ok",
                        );
                        loadSync();
                    } catch (e) {
                        showMsg($("#syncMsg"), e.message, "error");
                    } finally {
                        btn.disabled = false;
                    }
                });

                $("#syncPushBtn").addEventListener("click", async () => {
                    const btn = $("#syncPushBtn");
                    btn.disabled = true;
                    try {
                        const r = await api("/api/admin/sync/push", {
                            method: "POST",
                        });
                        showMsg(
                            $("#syncMsg"),
                            `Pushed ${r.pushed} rows, ${r.errors} errors.`,
                            r.errors > 0 ? "error" : "ok",
                        );
                        loadSync();
                    } catch (e) {
                        showMsg($("#syncMsg"), e.message, "error");
                    } finally {
                        btn.disabled = false;
                    }
                });

                $("#syncPullBtn").addEventListener("click", async () => {
                    if (
                        !confirm(
                            "Pull will overwrite local rows with Turso's version using INSERT OR REPLACE. Continue?",
                        )
                    )
                        return;
                    const btn = $("#syncPullBtn");
                    btn.disabled = true;
                    try {
                        const r = await api("/api/admin/sync/pull", {
                            method: "POST",
                        });
                        showMsg(
                            $("#syncMsg"),
                            r.restored
                                ? `Pulled ${r.rows} rows from Turso.`
                                : `No pull performed: ${r.reason || r.error || "unknown"}`,
                            r.restored ? "ok" : "error",
                        );
                        loadSync();
                    } catch (e) {
                        showMsg($("#syncMsg"), e.message, "error");
                    } finally {
                        btn.disabled = false;
                    }
                });

                boot();
            })();
        </script>
    </body>
</html>
